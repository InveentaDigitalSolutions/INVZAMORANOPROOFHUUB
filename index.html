<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zamorano — The Tropical Proof Hub</title>
<style>
  :root{
    --dark:#0E3B2E; --dark2:#09291F; --green:#1C6B4C; --lime:#8FBF3F;
    --gold:#E0A93B; --ink:#17241E; --muted:#6C7A70; --tint:#EEF3E9;
    --tint2:#E4EEDD; --line:#D5DFCE; --white:#FFFFFF;
    --serif:"Cambria","Georgia","Times New Roman",serif;
    --sans:"Calibri","Segoe UI",-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#05140E;font-family:var(--sans);-webkit-font-smoothing:antialiased}
  #stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
  #scaler{width:1280px;height:720px;position:relative;transform-origin:center center}
  .slide{position:absolute;inset:0;width:1280px;height:720px;display:none;padding:68px 72px;overflow:hidden}
  .slide.active{display:block}
  .slide.light{background:var(--white)}
  .slide.dark{background:var(--dark)}

  .eyebrow{font-size:13px;font-weight:700;letter-spacing:3px;text-transform:uppercase}
  .eyebrow.g{color:var(--green)} .eyebrow.l{color:var(--lime)}
  h1.title{font-family:var(--serif);font-weight:700;color:var(--dark);font-size:38px;line-height:1.12;margin-top:14px}
  .dark h1.title{color:var(--white)}
  .sub{font-size:17px;color:var(--muted);font-style:italic;margin-top:12px;max-width:1050px}

  .footer{position:absolute;left:72px;right:72px;bottom:34px;display:flex;justify-content:space-between;
    font-size:10px;letter-spacing:2px;color:var(--muted)}

  .node{border-radius:50%;display:inline-block}
  .card{border-radius:14px;padding:26px 28px;background:var(--tint)}
  .card.dark{background:var(--dark)}
  .shadow{box-shadow:0 6px 18px rgba(10,31,23,.16)}
  .klabel{font-size:13px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase}

  .chev{width:0;height:0;border-top:14px solid transparent;border-bottom:14px solid transparent;border-left:20px solid var(--gold)}

  /* title slide */
  .t-wrap{padding-top:96px;max-width:960px}
  .t-title{font-family:var(--serif);font-weight:700;color:#fff;font-size:56px;line-height:1.08;margin:22px 0 26px}
  .t-sub{font-size:20px;color:#C7D6BE;font-style:italic}
  .tagline{margin-top:44px;display:inline-flex;align-items:center;gap:14px;background:var(--dark2);
    border:1px solid var(--green);border-radius:30px;padding:15px 26px;color:#E7F0DF;font-weight:700;letter-spacing:.5px}
  .constel{position:absolute;top:70px;right:90px;width:340px;height:260px}
  .constel .node{position:absolute}
  .constel .ln{position:absolute;height:1px;background:var(--green);opacity:.5;transform-origin:left center}

  /* grids */
  .two{display:grid;grid-template-columns:1fr auto 1fr;gap:22px;align-items:stretch;margin-top:30px}
  .two.plain{grid-template-columns:1fr 1fr}
  .g6{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:30px}
  .g4{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-top:28px}
  .g5{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-top:28px}

  .mini{border-radius:12px;background:var(--tint);padding:20px}
  .mini h3{font-family:var(--serif);font-size:20px;color:var(--dark);margin-bottom:8px}
  .mini p{font-size:13px;color:var(--ink);line-height:1.45}
  .numnode{width:30px;height:30px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;
    color:#fff;font-weight:700;font-size:13px;margin-right:12px}

  .band{border-radius:14px;padding:22px 28px;margin-top:26px}
  .band.dark{background:var(--dark)}
  .band.tint{background:var(--tint2)}

  .stat .big{font-family:var(--serif);font-size:44px;font-weight:700;color:var(--green);line-height:1}
  .stat.dark .big{color:var(--lime)}
  .stat .lab{font-size:12px;font-weight:700;letter-spacing:1px;color:var(--muted);text-transform:uppercase;margin:10px 0 12px}
  .stat.dark .lab{color:#C7D6BE}
  .stat .desc{font-size:13px;color:var(--ink);line-height:1.5;border-top:1px solid var(--line);padding-top:12px}
  .stat.dark .desc{color:#DCE7D3;border-top:1px solid var(--green)}

  .chips{display:flex;flex-wrap:wrap;gap:12px;margin:20px 0 26px}
  .chip{background:var(--tint2);border-radius:20px;padding:9px 18px;font-size:13px;font-weight:700;color:var(--dark)}
  .badge{position:absolute;top:52px;right:72px;width:74px;height:74px;border-radius:50%;background:var(--dark);
    display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:32px;font-weight:700;color:var(--lime)}
  .met{font-size:12px;color:var(--muted);margin-top:20px}
  .met b{color:var(--muted)}

  /* hub diagram */
  .hub{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;gap:16px;align-items:center;margin-top:42px}
  .hubbox{border-radius:16px;padding:26px;border:1.5px solid var(--green);background:var(--dark2);min-height:210px}
  .hubbox.center{background:var(--lime);border-color:var(--lime);transform:scale(1.06)}
  .hubbox .n{font-family:var(--serif);font-weight:700;color:var(--lime);font-size:16px}
  .hubbox.center .n{color:var(--green)}
  .hubbox .k{font-size:12px;font-weight:700;letter-spacing:2px;color:var(--lime);margin:10px 0 6px}
  .hubbox.center .k{color:#14432A}
  .hubbox .big{font-family:var(--serif);font-weight:700;color:#fff;font-size:20px}
  .hubbox.center .big{color:var(--dark);font-size:23px}
  .hubbox p{font-size:13px;color:#C7D6BE;margin-top:12px;line-height:1.5}
  .hubbox.center p{color:#1E3A24}

  /* timeline */
  .row{display:grid;grid-template-columns:190px 1fr 1.15fr;gap:20px;align-items:center;
    background:var(--tint);border-radius:12px;padding:16px 22px;margin-bottom:12px}
  .pill{background:var(--dark);border-radius:20px;padding:9px 0;text-align:center;font-size:12px;font-weight:700}
  .row h4{font-family:var(--serif);font-size:17px;color:var(--dark)}
  .row p{font-size:13px;color:var(--ink);line-height:1.45}

  /* closing */
  .traj{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:16px}
  .tcard{background:var(--dark2);border:1px solid var(--green);border-radius:14px;padding:20px}
  .tcard h4{font-family:var(--serif);color:#fff;font-size:17px;margin-bottom:8px}
  .tcard p{font-size:13px;color:#C7D6BE;line-height:1.4}

  /* nav */
  #nav{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:14px;
    background:rgba(9,41,31,.82);padding:8px 16px;border-radius:24px;z-index:50;backdrop-filter:blur(6px)}
  #nav button{background:none;border:none;color:#C7D6BE;font-size:18px;cursor:pointer;padding:2px 8px;line-height:1}
  #nav button:hover{color:#fff}
  #count{color:#C7D6BE;font-size:12px;letter-spacing:1px;min-width:54px;text-align:center;font-family:var(--sans)}
  .hint{position:fixed;top:14px;left:50%;transform:translateX(-50%);color:#5c7a6a;font-size:11px;z-index:50;
    letter-spacing:.5px;transition:opacity .5s}
</style>
</head>
<body>
<div id="stage"><div id="scaler"></div></div>
<div class="hint" id="hint">Use ← / → arrow keys to navigate</div>
<div id="nav">
  <button id="prev" aria-label="Previous">‹</button>
  <span id="count">01 / 17</span>
  <button id="next" aria-label="Next">›</button>
</div>

<script>
const S = []; // slide HTML strings
const foot = n => `<div class="footer"><span>ZAMORANO · THE TROPICAL PROOF HUB</span><span>${String(n).padStart(2,'0')}</span></div>`;

/* 1 — TITLE */
S.push(`<section class="slide dark">
  <div class="constel">
    <span class="node" style="left:210px;top:20px;width:16px;height:16px;background:var(--lime)"></span>
    <span class="node" style="left:300px;top:80px;width:10px;height:10px;background:var(--green)"></span>
    <span class="node" style="left:150px;top:120px;width:14px;height:14px;background:var(--green)"></span>
    <span class="node" style="left:120px;top:150px;width:16px;height:16px;background:var(--lime)"></span>
    <span class="node" style="left:250px;top:170px;width:10px;height:10px;background:var(--lime)"></span>
    <span class="ln" style="left:218px;top:28px;width:92px;transform:rotate(33deg)"></span>
    <span class="ln" style="left:128px;top:158px;width:130px;transform:rotate(9deg)"></span>
  </div>
  <div class="t-wrap">
    <div class="eyebrow l">Zamorano University · Board of Trustees · 2026</div>
    <div class="t-title">Zamorano in a Fast-Evolving<br>Technology World</div>
    <div class="t-sub">The Tropical Proof Hub — from a European mission to a global position</div>
    <div class="tagline"><span class="node" style="width:16px;height:16px;background:var(--lime)"></span>
      Governance first &nbsp;·&nbsp; Evidence always &nbsp;·&nbsp; Adoption at scale</div>
  </div>
</section>`);

/* 2 — BRIDGE */
S.push(`<section class="slide light">
  <div class="eyebrow g">Purpose of this presentation</div>
  <h1 class="title">From what we saw to what it means</h1>
  <div class="sub">The first presentation reported the mission. This one draws its strategic conclusions.</div>
  <div class="two" style="margin-top:34px">
    <div class="card shadow">
      <div style="display:flex;align-items:center;gap:12px"><span class="node" style="width:20px;height:20px;background:var(--muted)"></span>
        <span class="klabel" style="color:var(--green)">The first presentation</span></div>
      <h3 style="font-family:var(--serif);font-size:22px;color:var(--dark);margin:18px 0 12px">What we did.</h3>
      <p style="font-size:15px;color:var(--ink);line-height:1.5">A European institutional mission — 15+ organizations across Germany and the Netherlands, the leaders we met, and what the delegation observed.</p>
      <div style="font-size:13px;font-weight:700;color:var(--muted);margin-top:26px">June 22 – July 2, 2026</div>
    </div>
    <div style="display:flex;align-items:center"><div class="chev"></div></div>
    <div class="card dark shadow">
      <div style="display:flex;align-items:center;gap:12px"><span class="node" style="width:20px;height:20px;background:var(--lime)"></span>
        <span class="klabel" style="color:var(--lime)">This presentation</span></div>
      <h3 style="font-family:var(--serif);font-size:22px;color:#fff;margin:18px 0 12px">What it means.</h3>
      <p style="font-size:15px;color:#DCE7D3;line-height:1.5">How agriculture is changing, the role Zamorano is uniquely built to hold, and how these separate visits become one coherent architecture.</p>
      <div style="font-size:13px;font-weight:700;color:#9FB394;margin-top:26px">A holistic view for the Board</div>
    </div>
  </div>
  ${foot(2)}
</section>`);

/* 3 — THE SHIFT */
S.push(`<section class="slide light">
  <div class="eyebrow g">The context</div>
  <h1 class="title">Success in agriculture is being redefined</h1>
  <div class="sub">Yield alone no longer describes the performance of a production system.</div>
  <div class="two" style="grid-template-columns:0.95fr auto 1.5fr;margin-top:34px">
    <div class="card">
      <div class="klabel" style="color:var(--muted)">Measured by</div>
      <div style="margin-top:20px;display:flex;flex-direction:column;gap:16px">
        <div style="font-family:var(--serif);font-size:20px;font-weight:700;color:var(--green)">Yield</div>
        <div style="font-family:var(--serif);font-size:20px;font-weight:700;color:var(--green)">Productivity</div>
        <div style="font-family:var(--serif);font-size:20px;font-weight:700;color:var(--green)">One discipline at a time</div>
      </div>
    </div>
    <div style="display:flex;align-items:center"><div class="chev"></div></div>
    <div class="card dark shadow">
      <div class="klabel" style="color:var(--lime)">Now measured by</div>
      <div style="margin-top:18px;display:flex;flex-direction:column;gap:14px">
        ${[['Nutritional yield','protein & micronutrient delivery per hectare'],
           ['Resilience','under heat, elevated CO₂ and ozone stress'],
           ['Food safety & traceability','lower mycotoxin and contamination risk'],
           ['Adoption at scale','validated practices producers actually use']]
          .map(x=>`<div style="display:flex;gap:12px;align-items:baseline">
            <span class="node" style="width:11px;height:11px;background:var(--lime);flex:none;transform:translateY(-1px)"></span>
            <span><b style="color:#fff;font-size:15px">${x[0]}</b> <span style="color:#BFD0B4;font-size:13.5px">— ${x[1]}</span></span></div>`).join('')}
      </div>
    </div>
  </div>
  <p style="font-size:12.5px;color:var(--muted);font-style:italic;margin-top:24px">Rising CO₂ and temperatures cut protein and key micronutrients in staple crops — so performance must be validated, measured and reproduced under real conditions.</p>
  ${foot(3)}
</section>`);

/* 4 — TECH CONVERGENCE */
const tech=[
  ['AI & exascale computing','Simulation of climate, soil and biological systems (JUWELS · JUPITER).'],
  ['Advanced phenotyping & sensing','Hyperspectral, fluorescence and field-to-cloud measurement.'],
  ['Robotics & automation','Field and controlled-environment operations at scale.'],
  ['Omics & microbiome','Genetics and biological function of soil, plant and product.'],
  ['Controlled-environment ag','Greenhouse and vertical systems, resource-efficient production.'],
  ['Energy & agrivoltaics','Food and energy generated on a single land base.']];
S.push(`<section class="slide light">
  <div class="eyebrow g">The fast-evolving technology world</div>
  <h1 class="title">The frontier has moved to the digital–biological intersection</h1>
  <div class="sub">Tomorrow's agriculture will not be transformed by agriculture alone — but by the convergence of these capabilities.</div>
  <div class="g6">
    ${tech.map((t,i)=>`<div class="mini shadow">
      <div style="display:flex;align-items:center;margin-bottom:10px">
        <span class="numnode" style="background:${i%2?'var(--green)':'var(--lime)'}">${i+1}</span>
        <h3 style="margin:0;font-size:16px">${t[0]}</h3></div>
      <p>${t[1]}</p></div>`).join('')}
  </div>
  ${foot(4)}
</section>`);

/* 5 — EXCELLENCE -> CONNECTIVITY */
S.push(`<section class="slide light">
  <div class="eyebrow g">A new institutional characteristic</div>
  <h1 class="title">Not only scientific excellence — scientific connectivity</h1>
  <div class="two plain" style="margin-top:32px">
    <div class="card shadow">
      <div class="klabel" style="color:var(--green)">Scientific excellence</div>
      <div style="font-family:var(--serif);font-size:19px;font-weight:700;color:var(--dark);margin:16px 0 14px;line-height:1.3">The quality of research produced within an institution.</div>
      <p style="font-size:14.5px;color:var(--ink);line-height:1.55">Indispensable — but it describes only part of the environment in which frontier science is now made.</p>
    </div>
    <div class="card dark shadow">
      <div class="klabel" style="color:var(--lime)">Scientific connectivity</div>
      <div style="font-family:var(--serif);font-size:19px;font-weight:700;color:#fff;margin:16px 0 14px;line-height:1.3">The ability to plug into the global ecosystems where new knowledge emerges.</div>
      <p style="font-size:14.5px;color:#DCE7D3;line-height:1.55">To participate in, contribute to, and benefit from advances that no single institution generates alone.</p>
    </div>
  </div>
  <div class="band tint" style="display:flex;align-items:center;gap:16px">
    <span class="node" style="width:16px;height:16px;background:var(--gold);flex:none"></span>
    <span style="font-family:var(--serif);font-size:18px;font-weight:700;font-style:italic;color:var(--dark)">As agricultural challenges grow more complex, connectivity becomes part of scientific capacity itself.</span>
  </div>
  ${foot(5)}
</section>`);

/* 6 — OPEN ROLE */
const eco=[['FZ Jülich','HPC / AI, phenotyping, sensors, quantum'],
  ['Cornell','Nanofab + photonics → CEA → post-harvest'],
  ['Wageningen','Systems, circularity & living labs'],
  ['INRAE','Policy, One-Health & agro-system depth'],
  ['UC Davis','Post-harvest, food safety & extension']];
S.push(`<section class="slide light">
  <div class="eyebrow g">The open role</div>
  <h1 class="title">No single ecosystem does it all</h1>
  <div class="sub">Each leading research ecosystem leads somewhere — none combines frontier capability with tropical proof-at-scale.</div>
  <div class="g5">
    ${eco.map(e=>`<div class="mini"><h3 style="font-size:17px">${e[0]}</h3><p style="font-size:12px">${e[1]}</p></div>`).join('')}
  </div>
  <div class="band dark shadow">
    <div class="klabel" style="color:var(--lime);letter-spacing:2px">The gap — and therefore the role</div>
    <div style="margin-top:12px"><span style="font-family:var(--serif);font-size:19px;font-weight:700;color:#fff">Tropical proof-at-scale</span>
      <span style="font-size:15px;color:#DCE7D3"> + standardized nutritional-yield metrics + auditable MRV/QA built for resource-limited settings.</span></div>
  </div>
  ${foot(6)}
</section>`);

/* 7 — ADVANTAGE */
const adv=[['4,000+','Hectares','A living agricultural system — not a research plot. Innovations are tested under real farm dynamics.',true],
  ['Field','Farmer-ready','Validation under real production conditions, not discovery alone — closing the prototype-to-proof gap.',false],
  ['Neutral','Pan-Latin ground','Non-governmental and regionally neutral — a trusted convening site for multinational validation.',false],
  ['Student','To-field chain','An alumni network across every agro-ecological zone of Latin America — translation faster than any extension service.',false]];
S.push(`<section class="slide light">
  <div class="eyebrow g">Comparative advantage</div>
  <h1 class="title">Zamorano is built to fill it</h1>
  <div class="sub">A living agricultural system where research, education, production and extension operate as one platform.</div>
  <div class="g4">
    ${adv.map(a=>`<div class="card stat ${a[3]?'dark':''} ${a[3]?'shadow':''}" style="${a[3]?'background:var(--dark)':'background:var(--tint)'}">
      <div class="big">${a[0]}</div><div class="lab">${a[1]}</div><div class="desc">${a[2]}</div></div>`).join('')}
  </div>
  ${foot(7)}
</section>`);

/* 8 — HUB DIAGRAM */
S.push(`<section class="slide dark">
  <div class="eyebrow l">The strategic position</div>
  <h1 class="title" style="font-size:34px">The Tropical Proof Hub</h1>
  <div class="sub" style="color:#C7D6BE">Zamorano does not replicate frontier discovery — it validates, adapts and transfers it at scale.</div>
  <div class="hub">
    <div class="hubbox"><div class="n">01</div><div class="k">Discovery</div><div class="big">Global partners</div><p>Science accessed through collaboration — not duplicated in-house.</p></div>
    <div class="chev"></div>
    <div class="hubbox center"><div class="n">02</div><div class="k">Validation</div><div class="big">Zamorano</div><p>Tested under tropical biological complexity, with auditable MRV/QA.</p></div>
    <div class="chev"></div>
    <div class="hubbox"><div class="n">03</div><div class="k">Adoption</div><div class="big">Producers &amp; partners</div><p>Reliable, transferable systems put to work across the tropics.</p></div>
  </div>
  <div style="text-align:center;margin-top:44px;color:#9FB394;font-weight:700;letter-spacing:2px;font-size:13px">Governance first · Evidence always · Adoption at scale</div>
</section>`);

/* 9 — MISSION AS ARCHITECTURE */
const pil=[['1','Discovery &<br>hard-tech anchor',['FZ Jülich (IBG-2 · JSC)','Univ. Bonn — Klein-Altendorf']],
  ['2','Mechanization &<br>soil systems',['CLAAS','LEMKEN']],
  ['3','Dairy<br>transformation',['GEA','Lely']],
  ['4','Protected ag,<br>seeds & markets',['BASF Nunhems','Koppert Cress','World Horti Center','Royal FloraHolland','Brightlands']],
  ['5','Energy–land &<br>ecosystem models',['Agri-Food-Energy Park','Agri-PV (Jülich · RWE)']]];
S.push(`<section class="slide light">
  <div class="eyebrow g">The European mission</div>
  <h1 class="title">The mission was not a tour — it was an architecture</h1>
  <div class="sub">Each institution maps to a capability Zamorano needs. Together they form five pillars.</div>
  <div class="g5" style="margin-top:26px">
    ${pil.map(p=>`<div class="mini shadow" style="min-height:300px">
      <span class="numnode" style="background:var(--dark);width:36px;height:36px;font-size:16px;font-family:var(--serif)">${p[0]}</span>
      <h3 style="font-size:15px;margin:14px 0 14px;line-height:1.25">${p[1]}</h3>
      ${p[2].map(i=>`<div style="background:#fff;border-radius:6px;padding:7px 10px;font-size:10.5px;color:var(--ink);margin-bottom:7px">${i}</div>`).join('')}
    </div>`).join('')}
  </div>
  ${foot(9)}
</section>`);

/* 10-14 PILLARS */
function pillar(num,n,tag,head,chips,cap,unlock,met){
  return `<section class="slide light">
    <div class="eyebrow g">${tag}</div>
    <div class="badge">${num}</div>
    <h1 class="title" style="max-width:960px">${head}</h1>
    <div class="chips">${chips.map(c=>`<span class="chip">${c}</span>`).join('')}</div>
    <div class="two plain">
      <div class="card shadow">
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:14px"><span class="node" style="width:16px;height:16px;background:var(--green)"></span>
          <span class="klabel" style="color:var(--green)">Capability gained</span></div>
        <p style="font-size:15px;color:var(--ink);line-height:1.55">${cap}</p>
      </div>
      <div class="card dark shadow">
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:14px"><span class="node" style="width:16px;height:16px;background:var(--lime)"></span>
          <span class="klabel" style="color:var(--lime)">What it unlocks for Zamorano</span></div>
        <p style="font-size:15px;color:#DCE7D3;line-height:1.55">${unlock}</p>
      </div>
    </div>
    <div class="met"><b>Met:</b> <span style="font-style:italic">${met}</span></div>
    ${foot(n)}
  </section>`;
}
S.push(pillar('1',10,'Pillar 1 · Discovery & hard-tech anchor','Access to frontier science, without owning it',

const scaler=document.getElementById('scaler');
scaler.innerHTML=S.join('');
const slides=[...document.querySelectorAll('.slide')];
let cur=0;
const count=document.getElementById('count');
function show(i){cur=(i+slides.length)%slides.length;slides.forEach((s,k)=>s.classList.toggle('active',k===cur));
  count.textContent=String(cur+1).padStart(2,'0')+' / '+String(slides.length).padStart(2,'0');}
document.getElementById('next').onclick=()=>show(cur+1);
document.getElementById('prev').onclick=()=>show(cur-1);
addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' ')show(cur+1);
  else if(e.key==='ArrowLeft')show(cur-1);
  else if(e.key==='Home')show(0);else if(e.key==='End')show(slides.length-1);});
function fit(){const s=Math.min(innerWidth/1280,innerHeight/720);scaler.style.transform='scale('+s+')';}
addEventListener('resize',fit);fit();show(0);
setTimeout(()=>{const h=document.getElementById('hint');if(h)h.style.opacity='0';},4000);
