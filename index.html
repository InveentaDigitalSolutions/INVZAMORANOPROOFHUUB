<title>Zamorano — The Tropical Proof Hub</title>
<style>
  :root{
    --dark:#0E3B2E; --dark2:#09291F; --green:#1C6B4C; --lime:#8FBF3F;

  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#05140E;font-family:var(--sans);-webkit-font-smoothing:antialiased}
  #stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;overflow:hidden}

  .slide{position:absolute;inset:0;width:1280px;height:720px;display:none;padding:68px 72px;overflow:hidden}
  .slide.active{display:block}
  .slide.light{background:var(--white)}
  .slide.dark{background:var(--dark)}

  .eyebrow{font-size:13px;font-weight:700;letter-spacing:3px;text-transform:uppercase}
  .eyebrow.g{color:var(--green)} .eyebrow.l{color:var(--lime)}
  h1.title{font-family:var(--serif);font-weight:700;color:var(--dark);font-size:38px;line-height:1.12;margin-top:14px}
  .dark h1.title{color:var(--white)}
  .sub{font-size:17px;color:var(--muted);font-style:italic;margin-top:12px;max-width:1050px}

  .footer{position:absolute;left:72px;right:72px;bottom:34px;display:flex;justify-content:space-between;
    align-items:center;font-size:10px;letter-spacing:2px;color:var(--muted)}

  .footer .credit{display:flex;align-items:center;gap:14px}
  .footer .brand{width:64px;height:13px;opacity:.6}
  .prepared{position:absolute;left:72px;bottom:46px;display:flex;align-items:center;gap:14px}
  .prepared .lab{font-size:10px;letter-spacing:2.4px;text-transform:uppercase;color:#7C9184}
  .prepared .brand{width:98px;height:20px}
  .corner{position:absolute;right:72px;bottom:38px;width:74px;height:15px;opacity:.55}

  .node{border-radius:50%;display:inline-block}
  .card{border-radius:14px;padding:26px 28px;background:var(--tint)}
  .card.dark{background:var(--dark)}
  .shadow{box-shadow:0 6px 18px rgba(10,31,23,.16)}
  .klabel{font-size:13px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase}

  .chev{width:0;height:0;border-top:14px solid transparent;border-bottom:14px solid transparent;border-left:20px solid var(--gold)}

  /* title slide */
  .t-wrap{padding-top:96px;max-width:960px}
  .t-title{font-family:var(--serif);font-weight:700;color:#fff;font-size:56px;line-height:1.08;margin:22px 0 26px}
  .t-sub{font-size:20px;color:#C7D6BE;font-style:italic}
  .tagline{margin-top:44px;display:inline-flex;align-items:center;gap:14px;background:var(--dark2);
    border:1px solid var(--green);border-radius:30px;padding:15px 26px;color:#E7F0DF;font-weight:700;letter-spacing:.5px}
  .constel{position:absolute;top:70px;right:90px;width:340px;height:260px}
  .constel .node{position:absolute}
  .constel .ln{position:absolute;height:1px;background:var(--green);opacity:.5;transform-origin:left center}

  /* grids */
  .two{display:grid;grid-template-columns:1fr auto 1fr;gap:22px;align-items:stretch;margin-top:30px}
  .two.plain{grid-template-columns:1fr 1fr}
  .g6{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:30px}
  .g4{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-top:28px}
  .g5{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-top:28px}

  .mini{border-radius:12px;background:var(--tint);padding:20px}
  .mini h3{font-family:var(--serif);font-size:20px;color:var(--dark);margin-bottom:8px}
  .mini p{font-size:13px;color:var(--ink);line-height:1.45}
  .numnode{width:30px;height:30px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;
    color:#fff;font-weight:700;font-size:13px;margin-right:12px}

  .band{border-radius:14px;padding:22px 28px;margin-top:26px}

  /* nav */

    background:rgba(9,41,31,.82);padding:8px 16px;border-radius:24px;z-index:50;backdrop-filter:blur(6px)}

  /* ——— slide transitions ——— */
  @keyframes slideIn{from{opacity:0;transform:translate3d(34px,0,0)}to{opacity:1;transform:none}}
  @keyframes slideInBack{from{opacity:0;transform:translate3d(-34px,0,0)}to{opacity:1;transform:none}}

  @keyframes riseScaled{from{opacity:0;transform:scale(1.06) translate3d(0,18px,0)}to{opacity:1;transform:scale(1.06)}}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}

  .slide.active{animation:slideIn .46s cubic-bezier(.22,.61,.36,1) both}
  .slide.active.rev{animation-name:slideInBack}
  .slide.active .ease{animation:rise .52s cubic-bezier(.22,.61,.36,1) both;

  .slide.active .footer,.slide.active .corner,.slide.active .prepared{animation:fadeIn .7s .45s both}

  /* ——— hover ——— */
  .card,.mini,.tcard,.row,.hubbox,.chip{transition:transform .3s cubic-bezier(.22,.61,.36,1),

  .card:hover,.mini:hover{transform:translateY(-5px);box-shadow:0 16px 36px rgba(10,31,23,.2)}

  /* hovering one tile in a grid lets its siblings recede */
  .g4:hover>*,.g5:hover>*,.g6:hover>*,.traj:hover>*{opacity:.48}

  /* pillar tiles on slide 09 jump to their detail slide */

  /* ——— chrome: progress, nav, overview ——— */
  #prog{position:fixed;top:0;left:0;height:2px;width:0;background:var(--lime);z-index:60;

    background:rgba(5,20,14,.95);backdrop-filter:blur(5px)}
  #grid.on{display:block;animation:fadeIn .22s both}
  #grid h2{font-family:var(--serif);color:#fff;font-size:21px;font-weight:700}

  #gg{display:grid;grid-template-columns:repeat(auto-fill,minmax(196px,1fr));gap:16px}
  .thumb{background:var(--dark);border:1px solid #1E5340;border-radius:10px;padding:15px 16px;cursor:pointer;

  .thumb:hover{transform:translateY(-4px);border-color:var(--lime);background:var(--dark2)}

  .thumb .tt{font-family:var(--serif);color:#fff;font-size:14px;line-height:1.32;margin-top:8px}

  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation-duration:.001ms!important;animation-delay:0ms!important;
      transition-duration:.001ms!important}
    .card:hover,.mini:hover,.tcard:hover,.hubbox:hover,.row:hover,.thumb:hover{transform:none}
  }
</style>
</head>
<body>

      </div>

        <div style="display:flex;align-items:center;gap:10px;margin-bottom:14px"><span class="node" style="width:16px;height:16px;background:var(--lime)"></span>

        <p style="font-size:15px;color:#DCE7D3;line-height:1.55">${unlock}</p>

    </div>

    ${foot(n)}
  </section>`;
}

  <div style="font-family:var(--serif);font-size:28px;font-weight:700;color:#9FB394;margin-top:22px">Zamorano is not a research institute.</div>

/* ---- render + nav ---- */
const scaler=document.getElementById('scaler');
scaler.innerHTML=S.join('');
const slides=[...document.querySelectorAll('.slide')];
let cur=0;
const count=document.getElementById('count'),prog=document.getElementById('prog'),
      grid=document.getElementById('grid'),gg=document.getElementById('gg'),pad=n=>String(n).padStart(2,'0');

/* stagger: tag the content blocks of every slide so they rise in sequence */
const EASE='.eyebrow,h1.title,.sub,.t-title,.t-sub,.tagline,.card,.mini,.hubbox,.tcard,.row,.band,.chips,.chev';
slides.forEach(s=>[...s.querySelectorAll(EASE)]
  .forEach((el,i)=>{el.classList.add('ease');el.style.setProperty('--i',Math.min(i,9));}));

/* overview grid, built from each slide's own heading */
const titleOf=s=>{
  const el=s.querySelector('h1.title,.t-title');
  const t=el?el.innerHTML.replace(/<br\s*\/?>/gi,' ').replace(/<[^>]+>/g,'').trim():'';
  return t||((s.querySelector('.eyebrow')||{}).textContent||'Slide').trim();
};
slides.forEach((s,i)=>{
  const t=document.createElement('button');
  t.className='thumb';t.dataset.i=i;
  t.innerHTML=`<div class="tn">${pad(i+1)}</div><div class="tt">${titleOf(s)}</div>`;
  gg.appendChild(t);
});
const thumbs=[...gg.children];

function show(i,back){
  const n=(i+slides.length)%slides.length;
  if(back===undefined)back=n<cur;
  cur=n;
  slides.forEach((s,k)=>{s.classList.toggle('rev',k===n&&back);s.classList.toggle('active',k===n);});
  count.textContent=pad(n+1)+' / '+pad(slides.length);
  prog.style.width=((n+1)/slides.length*100)+'%';
  thumbs.forEach((t,k)=>t.classList.toggle('now',k===n));
  if(location.hash!=='#'+(n+1)){hashLock=true;location.hash='#'+(n+1);}
}
const next=()=>show(cur+1,false), prev=()=>show(cur-1,true);

/* overview */
function overview(on){
  grid.classList.toggle('on',on);
  grid.setAttribute('aria-hidden',String(!on));
}
count.onclick=()=>overview(!grid.classList.contains('on'));
count.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();count.onclick();}};
gg.onclick=e=>{const t=e.target.closest('.thumb');if(t){overview(false);show(+t.dataset.i);}};

/* fullscreen */
const fs=document.getElementById('fs');
fs.onclick=()=>{document.fullscreenElement?document.exitFullscreen():
  document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen();};

document.getElementById('next').onclick=next;
document.getElementById('prev').onclick=prev;

/* pillar tiles jump to their detail slide */
scaler.addEventListener('click',e=>{
  const j=e.target.closest('.jump');
  if(j){show(+j.dataset.goto);return;}
  if(!e.target.closest('a,button,[role="button"]'))next();   // click anywhere to advance
});
scaler.addEventListener('keydown',e=>{
  const j=e.target.closest('.jump');
  if(j&&(e.key==='Enter'||e.key===' ')){e.preventDefault();show(+j.dataset.goto);}
});

addEventListener('keydown',e=>{
  if(grid.classList.contains('on')){if(e.key==='Escape'||e.key==='o'||e.key==='O')overview(false);return;}
  if(e.key==='ArrowRight'||e.key===' '||e.key==='PageDown')next();
  else if(e.key==='ArrowLeft'||e.key==='PageUp')prev();
  else if(e.key==='Home')show(0,true);else if(e.key==='End')show(slides.length-1,false);
  else if(e.key==='o'||e.key==='O')overview(true);
  else if(e.key==='f'||e.key==='F')fs.onclick();
});

/* swipe */
let tx=0,ty=0;
addEventListener('touchstart',e=>{tx=e.changedTouches[0].clientX;ty=e.changedTouches[0].clientY;},{passive:true});
addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-tx, dy=e.changedTouches[0].clientY-ty;
  if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy))dx<0?next():prev();
},{passive:true});

/* deep links: #7 opens slide 7 */
let hashLock=false;
addEventListener('hashchange',()=>{
  if(hashLock){hashLock=false;return;}
  const n=parseInt(location.hash.slice(1),10);
  if(n>=1&&n<=slides.length)show(n-1);
});

function fit(){const s=Math.min(innerWidth/1280,innerHeight/720);scaler.style.transform='scale('+s+')';}
addEventListener('resize',fit);fit();
const start=parseInt(location.hash.slice(1),10);
show(start>=1&&start<=slides.length?start-1:0,false);
setTimeout(()=>{const h=document.getElementById('hint');if(h)h.style.opacity='0';},5000);
</script>
